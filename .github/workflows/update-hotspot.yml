name: Update Hotspot Radar

on:
  schedule:
    # 上午：CST 08:50 = UTC 00:50（为 09:00 Agent 完整更新准备数据）
    - cron: "50 0 * * *"
    # 下午：CST 14:30 = UTC 06:30（为 14:40 Agent 完整更新准备数据）
    - cron: "30 6 * * *"
  # 支持手动触发
  workflow_dispatch:
    inputs:
      diagnose_jd_gateway:
        description: "仅测试 llm-gw.jd.local 连通性（不运行热点更新）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hotspot-radar-update
  cancel-in-progress: false

jobs:
  diagnose-jd-gateway:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_jd_gateway
    runs-on: ubuntu-latest
    steps:
      - name: Test JD LLM gateway connectivity
        shell: bash
        run: |
          set -u
          host="llm-gw.jd.local"

          echo "## JD LLM gateway connectivity" >> "$GITHUB_STEP_SUMMARY"
          if ! addresses="$(getent ahosts "$host")"; then
            echo "DNS resolution: failed" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "The GitHub-hosted runner cannot resolve $host. A JD-network self-hosted runner or public gateway is required." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "DNS resolution: succeeded" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$addresses"
          ping -c 2 -W 3 "$host" || echo "ICMP ping failed or is blocked; continuing with HTTPS test."

          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 8 --max-time 15 "https://$host/" || true)"
          if [[ "$status" == "000" ]]; then
            echo "HTTPS connectivity: failed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "HTTPS connectivity: succeeded (HTTP $status)" | tee -a "$GITHUB_STEP_SUMMARY"

  fetch-and-commit:
    if: github.event_name == 'schedule' || !inputs.diagnose_jd_gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch hotspot data
        run: node scripts/fetch-hotspot.mjs
        env:
          # JustOneAPI 小红书热搜接口 token（仓库 secret，未配置则自动跳过该源）
          JUSTONE_API_TOKEN: ${{ secrets.JUSTONE_API_TOKEN }}

      - name: Rule-based pre-filter
        run: node scripts/filter-hotspots.mjs

      - name: Local relevance and risk scoring
        run: node scripts/analyze-hotspots.mjs

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- data/raw data/processed public/data)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to commit."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected."
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/processed/ public/data/
          git commit -m "chore: update hotspot data $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M') CST"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
